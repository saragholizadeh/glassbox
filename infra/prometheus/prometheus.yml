# Prometheus — stores metrics.
#
# Prometheus PULLS: every 15 seconds it reads a /metrics page from each target.
# (Tempo is the one exception — it pushes to Prometheus.)

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: glassbox
    env: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # The apps' metrics. The apps push them to the Collector,
  # and Prometheus reads them from the Collector here.
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          source: otel

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
