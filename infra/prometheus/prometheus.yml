# Prometheus — stores metrics.
#
# Prometheus PULLS: every 15 seconds it reads a /metrics page from each target.
# (Tempo is the one exception — it pushes to Prometheus.)

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: glassbox
    env: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Metrics that arrive at the Collector are read from here.
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          source: otel

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  # Step 5 adds the apps here. They run on your machine, so from Docker
  # their address is host.docker.internal.
  #
  # - job_name: services
  #   static_configs:
  #     - targets:
  #         - 'host.docker.internal:3001'
  #         - 'host.docker.internal:3002'
  #         - 'host.docker.internal:3003'
