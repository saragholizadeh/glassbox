# OpenTelemetry Collector
#
# Every service sends ALL of its telemetry here — traces, metrics and logs —
# over a single protocol (OTLP). The Collector then splits it up and forwards
# each kind to the right storage.
#
# Why bother instead of exporting straight to Tempo/Prometheus/Loki?
#   - Your app code never learns the name of your monitoring vendor. Swapping
#     Tempo for something else is a change in this file, not a redeploy.
#   - Sampling and filtering happen here, where the whole trace is visible.
#   - One network hop out of the app instead of three.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Stops the Collector eating all the memory on your laptop if a service
  # suddenly floods it. Always put this FIRST in every pipeline.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

  # Stamps every signal with where it came from.
  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

  # Groups telemetry into batches before sending. Always put this LAST.
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Loki 3.x accepts OTLP natively at /otlp/v1/logs.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  # Not a push exporter: this opens a /metrics page that Prometheus scrapes.
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    resource_to_telemetry_conversion:
      enabled: true

  # Prints a one-line summary of what passes through. Handy in step 3 when
  # you are not yet sure anything is arriving at all:
  #   docker compose logs -f otel-collector
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/tempo, debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki]

  telemetry:
    logs:
      level: info
    metrics:
      level: basic
