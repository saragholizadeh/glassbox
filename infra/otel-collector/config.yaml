# OpenTelemetry Collector — the "post office".
#
# Services send traces here. The Collector also reads the log files.
# Then it sends each kind of data to the right storage:
#   traces → Tempo, metrics → Prometheus, logs → Loki

receivers:
  # Services send traces here (port 4318 over HTTP, 4317 over gRPC).
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Reads the JSON log files from logs/ and turns each line into a log record.
  filelog:
    include: [/var/log/glassbox/*.log]
    start_at: end
    operators:
      # Each line is JSON. Read its fields.
      - type: json_parser
        parse_from: body
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%dT%H:%M:%S.%LZ'
        severity:
          parse_from: attributes.level

      # Make "service" a label, so you can filter by it in Grafana.
      - type: move
        from: attributes.service
        to: resource["service.name"]

      # Use the message as the main text of the log line.
      - type: move
        from: attributes.msg
        to: body

processors:
  # Stops the Collector from using too much memory. Always first.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

  # Adds "local" as the environment to all data.
  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

  # Sends data in groups instead of one by one. Always last.
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  # Prometheus reads metrics from this page (pull, not push).
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    resource_to_telemetry_conversion:
      enabled: true

  # Prints a short summary of what arrives. See it with:
  #   docker compose logs -f otel-collector
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/tempo, debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki]

  telemetry:
    logs:
      level: info
    metrics:
      level: basic
