# Tempo — stores traces.
#
# Single-binary mode with local disk storage. Fine for a laptop, not for
# production (there you would point `storage.trace.backend` at S3/GCS).

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Flush blocks quickly so a trace shows up in Grafana within seconds
  # instead of minutes. Only sensible because this is a dev setup.
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Turns traces into metrics automatically:
#   - span-metrics  -> request rate / error rate / duration per span, for free
#   - service-graphs -> the "who calls who" map you will see in step 4
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
