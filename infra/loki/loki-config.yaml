# Loki — stores logs.
#
# Loki does not index your log text. It only indexes a handful of labels
# (service_name, level, ...) and compresses the rest. That is why it is cheap,
# and also why you should NEVER put a high-cardinality value like a user id or
# a trace id into a label. Trace ids go in structured metadata instead — which
# is what `allow_structured_metadata` below enables.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Required for OTLP log ingestion, and how trace_id rides along with a log
  # line without becoming an indexed label.
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 24h
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true

analytics:
  reporting_enabled: false
