# Grafana loads every dashboard file in infra/grafana/dashboards/.

apiVersion: 1

providers:
  - name: glassbox
    orgId: 1
    folder: Glassbox
    type: file
    disableDeletion: false
    updateIntervalSeconds: 15
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
