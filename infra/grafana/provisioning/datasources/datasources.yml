# Grafana's data sources. Loaded on startup.
#
# The links between them are the useful part:
#   Tempo → Loki: click a span, see its logs
#   Loki → Tempo: click a trace_id in a log, see the trace

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      # From a point on a graph, jump to a trace. Used in step 5.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        # Use $$, not $. With one $, Grafana treats it as an env variable,
        # makes it empty, and the link breaks with no error.
        query: '{service_name="$${__span.tags["service.name"]}"} | trace_id="$${__span.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      streamingEnabled:
        search: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        # Makes trace_id in a log line a clickable link to the trace.
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          # $$ again — see above.
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: 'View trace'
